<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slovuka Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #222222;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 15px;
    }

    .main-column {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-box {
      background-color: #191919;
      border-radius: 14px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pfp-container {
      margin-top: 10px;
      margin-bottom: 16px;
    }

    .pfp {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background-color: #2b2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 600;
      overflow: hidden;
    }

    .pfp img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .username-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .username {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
    }

    .verified-icon {
      position: relative;
      width: 29px;
      height: 29px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .verified-icon .bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('assets/checkmarkback.svg') no-repeat center center;
      background-size: contain;
      filter: invert(32%) sepia(98%) saturate(2250%) hue-rotate(218deg) brightness(101%) contrast(103%);
    }

    .verified-icon .check {
      position: relative;
      z-index: 1;
      width: 25px;
      height: 25px;
      background: url('assets/checkmark.svg') no-repeat center center;
      background-size: contain;
      filter: brightness(0) invert(1);
    }

    .followers-badge {
      background-color: #2b2b2b;
      color: #c4c4cc;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 8px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .tags-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
    }

    .tag {
      background-color: #2b2b2b;
      color: #c4c4cc;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .description {
      text-align: center;
      color: #c4c4cc;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 480px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .cards-grid {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center; /* Центрирует карточки, если они не заполнили ряд до конца */
    }

    .cards-grid .card-frame {
      width: calc(50% - 8px); /* Каждая карточка занимает ровно половину минус отступ */
      max-width: 308px;
    }

    @media (max-width: 550px) {
      .cards-grid .card-frame {
        width: 100%; /* На мобилках на всю ширину */
      }
    }

    .single-card-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .single-card-container .card-frame {
      width: 100%;
      max-width: 308px;
    }

    .card-frame {
      background-color: #2b2b2b;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      padding-top: 2px;
    }

    .preview-16-9 {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #595959;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      overflow: hidden;
    }

    .preview-16-9 img,
    .preview-16-9 video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat-tag {
      background-color: #222222;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #c4c4cc;
      display: flex;
      gap: 6px;
      justify-content: flex-start;
    }

    .stat-tag strong {
      color: #ffffff;
    }

    .card-content-text {
      font-size: 0.85rem;
      color: #c4c4cc;
      line-height: 1.4;
      padding: 2px 4px;
    }

    .update-time {
      font-size: 0.75rem;
      color: #c4c4cc;
      text-align: center;
      margin-top: 12px;
    }

    .buttons-container {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .icon-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      width: 37px;
      height: 37px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .icon-btn:hover {
      background-color: #e1e1e6;
      transform: translateY(-1px);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: #000000;
    }

    .contact-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 10px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .contact-btn:hover {
      background-color: #e1e1e6;
      transform: translateY(-1px);
    }

    .icon-btn img[src*="robloxlogo.svg"] {
      filter: brightness(0);
    }
  </style>
</head>
<body>

<div class="main-column">

  <div class="section-box">
    <div class="pfp-container">
      <div class="pfp"></div>
    </div>

    <div class="username-container">
      <h1 class="username">Slovuka</h1>
      <div class="verified-icon">
        <div class="bg"></div>
        <div class="check"></div>
      </div>
    </div>

    <div class="followers-badge">0 Followers</div>

    <div class="tags-container">
      <span class="tag">Scripter</span>
      <span class="tag">UI Designer</span>
      <span class="tag">Game Designer</span>
    </div>

    <p class="description">
      description description description description description description description description
    </p>

    <div class="buttons-container">
      <button onclick="copyDiscord()" id="contactBtn" class="contact-btn">Contact</button>

      <a href="https://www.roblox.com/users/6174930173/profile" target="_blank" class="icon-btn" title="Roblox Profile">
        <img src="assets/robloxlogo.svg" alt="Roblox" style="width: 20px; height: 20px;">
      </a>
    </div>

    <script>
      function copyDiscord() {
        const username = "slovuka";
        navigator.clipboard.writeText(username);

        const btn = document.getElementById("contactBtn");
        btn.innerText = "Discord Copied";
        setTimeout(() => {
          btn.innerText = "Contact";
        }, 2000);
      }
    </script>
  </div>

  <div class="section-box">
    <h2 class="section-title">Games</h2>

    <div class="single-card-container">

      <div class="card-frame">
        <a class="card-header-title" id="gameTitle" href="#" target="_blank" style="text-decoration: none">Game Name</a>

        <div class="preview-16-9" id="gamePreview">

        </div>

        <div class="game-stats-grid">
          <div class="stat-tag"><span>Active</span><span id="statActive">0</span></div>
          <div class="stat-tag"><span>Peak</span><span>-</span></div>
          <div class="stat-tag"><span>Visits</span><span id="statVisits">0</span></div>
          <div class="stat-tag"><span>Favorites</span><span id="statFavs">0</span></div>
        </div>

      </div>
    </div>

    <div class="update-time" id="updateTime">Data Updated: Loading</div>
  </div>

  <div class="section-box">
    <h2 class="section-title">Works</h2>

    <div class="cards-grid">

      <div class="card-frame">
        <div class="card-header-title">Work Name</div>
        <div class="preview-16-9"></div>
        <div class="card-content-text">
          Description Description Description
        </div>
      </div>

    </div>
  </div>

</div>
  
<script>
  async function loadRobloxStats() {
    try {
      const response = await fetch('./data.json?t=' + new Date().getTime());
      if (!response.ok) return;
      const data = await response.json();

      if (data.avatar) {
        const pfpElement = document.querySelector('.pfp');
        pfpElement.innerHTML = `<img src="${data.avatar}" alt="pfp">`;
      }

      if (data.followers !== undefined) {
        document.querySelector('.followers-badge').innerText = `${data.followers.toLocaleString()} Followers`;
      }

      if (data.game) {
        document.getElementById('gameTitle').innerText = data.game.name || 'Game Name';
        if (data.game.url) {
          document.getElementById('gameTitle').href = data.game.url;
        }
        document.getElementById('statActive').innerText = data.game.active.toLocaleString();
        document.getElementById('statVisits').innerText = data.game.visits.toLocaleString();
        document.getElementById('statFavs').innerText = data.game.favorites.toLocaleString();

        if (data.game.image) {
          document.getElementById('gamePreview').innerHTML = `<img src="${data.game.image}" alt="Game Cover">`;
        }
      }
      
      if (data.last_updated) {
        document.getElementById('updateTime').innerText = `Last Data Updated: ${data.last_updated}`;
      }
      
    } catch (e) {
      console.log('Error loading stats');
    }
  }

  loadRobloxStats();
</script>
  
</body>
</html>
